  <body class="bg-[#F4F6F3] text-[#252B2D] antialiased selection:bg-[#80B8B4] selection:text-[#252B2D]">
    <div id="root"></div>
    <!-- EIRA_APP_ENTRY -->
    <script type="module" id="eira-static-loader">
      if (!document.querySelector('script[data-eira-vite="true"]')) {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './public/app-bundle.css';
        css.onerror = () => {
          const fallbackCss = document.createElement('link');
          fallbackCss.rel = 'stylesheet';
          fallbackCss.href = './app-bundle.css';
          document.head.appendChild(fallbackCss);
        };
        document.head.appendChild(css);

        const js = document.createElement('script');
        js.type = 'module';
        js.src = './public/app-bundle.js';
        js.onerror = () => {
          const fallbackJs = document.createElement('script');
          fallbackJs.type = 'module';
          fallbackJs.src = './app-bundle.js';
          document.body.appendChild(fallbackJs);
        };
        document.body.appendChild(js);
      }
    </script>
  </body>
</html>
